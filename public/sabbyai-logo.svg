<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </radialGradient>

    <!-- Main Ribbon Gradient (F-Monogram & Heart Loop) -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="45%" stop-color="#7C3AED"/>
      <stop offset="80%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="sparkle-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Vibrant Sparkle Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Mode Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg-glow)"/>

  <!-- Subtle Network / Connection Ring Background Overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1.5" fill="none">
    <circle cx="256" cy="256" r="160" stroke-dasharray="6 10"/>
    <circle cx="256" cy="256" r="210" stroke-dasharray="4 8"/>
  </g>

  <!-- ICON MARK -->
  <g id="logo-icon" filter="url(#shadow)">
    
    <!-- Primary Continuous Path forming 'F' Stem + Loop -->
    <path d="M 180 400 
             V 190 
             C 180 140, 225 105, 275 125 
             C 320 143, 325 195, 280 225 
             L 245 255
             C 215 280, 180 315, 180 350" 
          fill="none" 
          stroke="url(#primary-grad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Intersecting Heart Arc / Upper Crossbar of 'F' -->
    <path d="M 245 200 
             C 280 165, 340 175, 355 220 
             C 370 270, 310 320, 240 375 
             L 180 420" 
          fill="none" 
          stroke="url(#primary-grad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.95"/>

    <!-- Central Memory Node / Connection Dot -->
    <circle cx="250" cy="250" r="10" fill="#FFFFFF" filter="url(#glow)"/>

    <!-- AI Sparkle 1 (Top Right - Intelligence / Insights) -->
    <g transform="translate(370, 135) scale(1.1)" filter="url(#glow)">
      <path d="M0,-16 C2,-5 5,-2 16,0 C5,2 2,5 0,16 C-2,5 -5,2 -16,0 C-5,-2 -2,-5 0,-16 Z" fill="#38BDF8"/>
    </g>

    <!-- AI Sparkle 2 (Bottom Left Accent) -->
    <g transform="translate(130, 410) scale(0.75)" filter="url(#glow)">
      <path d="M0,-16 C2,-5 5,-2 16,0 C5,2 2,5 0,16 C-2,5 -5,2 -16,0 C-5,-2 -2,-5 0,-16 Z" fill="#F472B6"/>
    </g>

    <!-- Connection Line Terminal Dots -->
    <circle cx="180" cy="400" r="7" fill="#A5B4FC"/>
    <circle cx="180" cy="190" r="7" fill="#A5B4FC"/>
  </g>
</svg>
